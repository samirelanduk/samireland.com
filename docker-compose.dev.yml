version: "3"

x-api-base: &api-base
  image: samirelanduk/sidc_django
  restart: always
  env_file:
    - secrets.env
  environment: &api-environment
    - DEBUG=yes
  volumes:
    - ./django:/home/app
    - ./media:/home/app/media

services:
  pgbackups:
    volumes:
      - ./backups:/backups
  nginx:
    volumes:
      - ./media:/home/app/media
    ports:
      - "${PORT:-9000}:80"
  docs:
    volumes:
      - ./media:/home/app/media
    ports:
      - "${DOCSPORT:-9002}:80"