version: "3"

x-api-base: &api-base
  image: samirelanduk/sidc_django:${TAG:-latest}
  restart: always
  env_file:
    - secrets.env
  environment: &api-environment
    - DB_URL=postgresql://sidc:sidc@postgres:5432/sidc
    - STATIC_ROOT=/home/app/static
    - MEDIA_ROOT=/home/app/media
    - FRONTEND_URL=$FRONTEND_URL
  volumes:
    - static:/home/app/static
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    hostname: postgres
    container_name: sidc_postgres
    image: postgres:14
    environment:
      - POSTGRES_USER=sidc
      - POSTGRES_PASSWORD=sidc
      - POSTGRES_DB=sidc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidc"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgbackups:
    hostname: backups
    container_name: sidc_backups
    image: prodrigestivill/postgres-backup-local:14
    restart: always
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=sidc
      - POSTGRES_PASSWORD=sidc
      - POSTGRES_USER=sidc
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    volumes:
      - ./backups:/backups
  
  upgrade:
    <<: *api-base
    restart: "no"
    hostname: upgrade
    container_name: sidc_upgrade
    command: python manage.py migrate
    deploy:
      restart_policy:
        condition: on-failure

  collectstatic:
    <<: *api-base
    restart: "no"
    hostname: collectstatic
    container_name: sidc_collectstatic
    command: python manage.py collectstatic --noinput
    deploy:
      restart_policy:
        condition: on-failure

  django:
    <<: *api-base
    hostname: django
    container_name: sidc_django
    expose:
      - 80
    build:
      context: django
      args:
        - STATIC_ROOT=/home/app/static
    command: ["gunicorn", "core.wsgi:application", "--bind", "0.0.0.0:80", "--workers", "3", "--reload", "--log-level", "debug"]
  
  next:
    hostname: next
    container_name: sidc_next
    image: samirelanduk/sidc_next:${TAG:-latest}
    expose:
      - 80
    env_file:
      - secrets.env
    environment:
      - NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
      - NEXT_PUBLIC_MEDIA_URL=$MEDIA_URL
    build:
      context: next
      network: host
      args:
        - NEXT_PUBLIC_MEDIA_URL=$MEDIA_URL
        - NEXT_PUBLIC_API_URL=$BUILD_API_URL
        - NEXT_PUBLIC_ALLOW_FALLBACK=$NEXT_PUBLIC_ALLOW_FALLBACK
  
  nginx:
    hostname: nginx
    container_name: sidc_nginx
    image: samirelanduk/sidc_nginx
    build: .
    environment:
      - VIRTUAL_HOST=$HOSTNAME,www.$HOSTNAME
      - LETSENCRYPT_HOST=$HOSTNAME,www.$HOSTNAME
    depends_on:
      - django
      - next
    volumes:
      - static:/home/app/static
  
  docs:
    hostname: docs
    container_name: sidc_docs
    image: samirelanduk/sidc_docs
    build:
      context: .
      args:
        - CONF_NAME=docs.conf
    environment:
      - VIRTUAL_HOST=$DOCS_HOSTNAME
      - LETSENCRYPT_HOST=$DOCS_HOSTNAME
    depends_on:
      - django
      - next
  
volumes:
  postgres_data:
  static: